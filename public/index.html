<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#10192b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PPPYLLES" />
  <meta name="description" content="輕鬆放置的觀賞型水族養成遊戲" />
  <title>PPPYLLES</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <canvas id="stage" aria-label="水族箱"></canvas>

  <!-- 頂部資訊列 -->
  <header class="hud-top">
    <div class="pill coin-pill nine-pill" id="hud-coins">
      <span class="coin-icon" aria-hidden="true"></span>
      <span class="coin-value" id="hud-coin-value">0</span>
      <span class="coin-rate" id="hud-coin-rate">+0/秒</span>
    </div>
    <div class="hud-right">
      <div class="test-badge">測試模式</div>
      <div class="pill tank-pill nine-pill" id="hud-tank">
        <span class="ico i-tank pill-ico" aria-hidden="true"></span>
        <span class="coin-value" id="hud-tank-value">0/0</span>
      </div>
    </div>
  </header>

  <!-- 底部選單 -->
  <nav class="hud-dock nine-dock">
    <button class="dock-btn" data-nosfx data-open="shop" title="商店"><span class="ico i-shop dock-ico"></span><span class="dock-label">商店</span></button>
    <button class="dock-btn" data-nosfx data-open="codex" title="圖鑑"><span class="ico i-codex dock-ico"></span><span class="dock-label">圖鑑</span></button>
    <button class="dock-btn" data-nosfx data-open="decor" title="裝飾"><span class="ico i-decor dock-ico"></span><span class="dock-label">裝飾</span></button>
    <button class="dock-btn" data-nosfx data-open="settings" title="設定"><span class="ico i-settings dock-ico"></span><span class="dock-label">設定</span></button>
  </nav>

  <!-- 面板容器 -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet nine-panel" id="sheet" role="dialog" aria-modal="true" hidden>
    <header class="sheet-head">
      <h2 class="sheet-title" id="sheet-title"></h2>
      <button class="sheet-close i-close" id="sheet-close" data-nosfx aria-label="關閉">×</button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <div class="boot" id="boot">
    <div class="boot-title">PPPYLLES</div>
    <div class="boot-sub">水族箱準備中…</div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
