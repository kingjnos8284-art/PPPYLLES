<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#06223a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PPPYLLES" />
  <meta name="description" content="輕鬆放置的觀賞型水族養成遊戲" />
  <title>PPPYLLES</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <canvas id="stage" aria-label="水族箱"></canvas>

  <!-- 頂部資訊列 -->
  <header class="hud-top">
    <div class="pill coin-pill" id="hud-coins">
      <span class="coin-icon" aria-hidden="true"></span>
      <span class="coin-value" id="hud-coin-value">0</span>
      <span class="coin-rate" id="hud-coin-rate">+0/秒</span>
    </div>
    <div class="pill tank-pill" id="hud-tank">魚 0/0</div>
  </header>

  <!-- 底部選單 -->
  <nav class="hud-dock">
    <button class="dock-btn" data-open="shop"><span class="dock-ico ico-shop"></span><span>商店</span></button>
    <button class="dock-btn" data-open="codex"><span class="dock-ico ico-codex"></span><span>圖鑑</span></button>
    <button class="dock-btn is-locked" data-open="decor"><span class="dock-ico ico-decor"></span><span>裝飾</span></button>
    <button class="dock-btn" data-open="settings"><span class="dock-ico ico-settings"></span><span>設定</span></button>
  </nav>

  <!-- 面板容器 -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <header class="sheet-head">
      <h2 class="sheet-title" id="sheet-title"></h2>
      <button class="sheet-close" id="sheet-close" aria-label="關閉">×</button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <div class="boot" id="boot">
    <div class="boot-title">PPPYLLES</div>
    <div class="boot-sub">水族箱準備中…</div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
